# nostrogotho runtime config: key = value, '#' starts a comment.
# Unknown keys or invalid values are rejected at startup.

# SQLite writer durability: full (default) or normal.
# full: sync WAL on every batch commit; OK is sent after COMMIT.
# normal: faster, but power loss/kernel crash may lose recent batches.
db_sync = full

# Threads. auto = CPUs this process may use (sched affinity / cpuset).
# io_threads: event loops (accept + WebSocket I/O, fan-out writes; the kernel
# spreads connections across them with SO_REUSEPORT). workers: protocol,
# signature verification and queries. NG_IO_THREADS / NG_WORKERS override.
# io_threads = auto
# workers = auto

# listen(2) backlog (pending, not yet accepted connections) per I/O loop
# socket. auto = net.core.somaxconn; the kernel caps any value at it, so
# raise somaxconn (and tcp_max_syn_backlog) too for reconnect storms.
# listen_backlog = auto

# --- overload protection (byte values accept K/M/G suffixes) -------------
# Per-connection output backlog (bytes user space holds because the client
# reads too slowly). Over it the connection is closed. A connection whose
# backlog is above half of this gets new REQ/COUNT/EVENT answered with
# CLOSED / OK false "error: ...". One REQ's stored-event reply is capped
# at half of this (later matches are dropped, EOSE still follows).
# conn_outbound_max = 4M
# Process-wide output budget (all socket backlogs + queued deliveries).
# Over 75% the slowest readers (largest backlog above 64 KiB first) are
# closed until usage is back under 50%; over 90% new REQ/COUNT/EVENT work
# is rejected ("error: relay overloaded"); at 100% no connection may grow
# a backlog above 64 KiB. Note the kernel also buffers up to tcp_wmem[2]
# per socket before any of this applies.
# total_outbound_max = 1G
# Inbound bytes queued per worker thread, and messages queued per
# connection. Over either, the I/O thread answers the message itself with
# OK false / CLOSED / NOTICE "error: relay overloaded" (never blocks).
# worker_queue_max = 16M
# conn_pending_max = 1024
# EVENTs waiting for the single SQLite writer; when full, OK false.
# writer_queue_max = 65536

# --- protocol limits (published in the NIP-11 limitation object) ---------
# Largest client message (WebSocket payload) and largest event, measured as
# its serialized JSON. Long-form (NIP-23) articles and big follow lists fit
# the defaults.
# max_message_length = 5M
# max_event_size = 512K
# Bytes of an event's "content" (NIP-11 calls this max_content_length).
# max_content_length = 256K
# Tags per event (a kind 3 follow list has one per follow).
# max_event_tags = 5000
# Open subscriptions per connection, filters per REQ/COUNT (1-64) and the
# subscription id length.
# max_subscriptions = 100
# max_filters = 20
# max_subid_length = 100
# Stored events per filter: the cap on a client's "limit", and the number
# sent when a filter has no "limit".
# max_limit = 500
# default_limit = 500
# Values in one filter field (ids, authors, kinds, each #x), and authors
# summed over all filters of one REQ/COUNT. A home feed is one filter with
# every followed pubkey. Over a limit the REQ is answered CLOSED "error:".
# max_filter_items = 5000
# max_req_authors = 10000
# NIP-50 full-text search over event content (SQLite FTS5, ranked by
# bm25). Costs publish throughput on text-heavy loads (the index is
# written by the one writer in the same FULL-sync commit). 0 drops the
# index and answers search filters CLOSED "unsupported:"; turning it back
# on rebuilds the index from the stored events at startup.
# search = 1
# NIP-01 tag index. Only tags named by these letters get index rows (one
# per tag, written by the writer in the event's commit); "*" indexes all 52
# letters. Filters on any other letter (#x, #E, #K, #r ...) still return
# exactly the right events, but by reading each candidate event's stored
# tags JSON instead of an index lookup: SLOWER, proportional to the events
# the rest of the filter (kinds, authors, since/until, an indexed tag)
# leaves to check. Add the letters your clients query heavily.
# tag_index_letters = epaqtdhk
# At most this many tags per event get index rows; an event with more is
# listed in a small overflow table and its remaining tags are found through
# its tags JSON (correct, slower for those events only). Bounds the writer
# cost of huge tag lists (follow lists, mute lists, spam).
# tag_index_max_per_event = 2000
# Changing either setting rebuilds the tag index from the stored events at
# the next startup (one transaction; minutes on a large database).

# --- rate limits and bans -------------------------------------------------
# Token buckets (GCRA, lock-free, shared by every worker): a sustained rate
# per minute and a burst. 0 = no limit (default). Over the limit: EVENT ->
# OK false "rate-limited: ...", REQ/COUNT -> CLOSED "rate-limited: ...".
# The per-IP budget is shared by all of a client's connections (IPv6 per
# /64); the per-pubkey one is charged only after the signature verified.
# rate_events_per_min_ip = 0
# rate_events_burst_ip = 60
# rate_events_per_min_pubkey = 0
# rate_events_burst_pubkey = 30
# rate_reqs_per_min_ip = 0
# rate_reqs_burst_ip = 60
# Bans, read at startup: events by a banned pubkey get OK false
# "blocked: ..."; a banned IP gets NOTICE "blocked: ..." and is
# disconnected. Inline lists are comma separated; ban_file holds one
# "pubkey <hex>" or "ip <address>" per line (# comments). A bad entry stops
# startup with its line number.
# banned_pubkeys =
# banned_ips =
# ban_file =
# Behind a reverse proxy every connection comes from the proxy's address.
# When the TCP peer is in trusted_proxies (addresses or CIDR prefixes,
# comma separated; empty = trust nobody), the client address used for the
# per-IP limits, IP bans and logs is taken from X-Forwarded-For: the
# rightmost entry that is not itself a trusted proxy (anything to its left
# was written by the client and is not believed). Without X-Forwarded-For,
# a valid X-Real-IP is used. From any other peer both headers are ignored.
# List only proxies you run, and make sure clients cannot reach the relay
# port directly from an address in the list.
# trusted_proxies = 127.0.0.1,::1
#
# Matching nginx site (relay on 127.0.0.1:8080; TLS lines omitted):
#   location / {
#       proxy_pass http://127.0.0.1:8080;
#       proxy_http_version 1.1;
#       proxy_set_header Upgrade $http_upgrade;
#       proxy_set_header Connection "upgrade";
#       proxy_set_header Host $host;
#       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#       proxy_set_header X-Real-IP $remote_addr;
#       proxy_read_timeout 1h;
#   }
# $proxy_add_x_forwarded_for appends the address nginx saw to whatever the
# client sent, which is why the rightmost untrusted entry is the one used.
# A second proxy tier in front of nginx (a load balancer, a CDN) must be
# added to trusted_proxies too, or its address is taken as the client.

# --- relay identity and policy (NIP-11, NIP-42, NIP-62) ------------------
# Public WebSocket URL of this relay. NIP-42 AUTH events must carry it as
# their "relay" tag (compared case-insensitively, trailing '/' ignored) and
# NIP-62 vanish requests naming it are honored. SERVICE_URL / -service-url
# override it. When unset the relay warns at startup and AUTH accepts any
# ws:// or wss:// relay tag: the random per-connection challenge still
# binds the AUTH event to this relay, but set it in production.
# relay_url = wss://relay.example.com
# NIP-11 document fields (omitted when empty). Values run to the end of the
# line; '#' starts a comment, so it cannot appear in a value.
# relay_name = nostrogotho
# relay_description =
# relay_pubkey =            # operator's pubkey, 64 lowercase hex
# relay_self =              # the relay's own pubkey, 64 lowercase hex
# File holding the relay's own 64-hex secret key. Required for NIP-29
# groups (the relay signs kinds 39000-39003 and join/leave 9000/9001);
# relay_self defaults to its pubkey and must match it when set. Keep the
# file private (chmod 600); its content is never logged.
# relay_secret_key_file =
# NIP-29 late publication: events to a group older than this (seconds)
# are refused; 0 accepts any age (e.g. while importing a moved group).
# group_max_age = 3600
# NIP-43 relay membership (needs relay_secret_key_file): kind 28934 claims
# with one of invite_codes join, 28936 leaves; the relay publishes its
# member list (13534) and add/remove events (8000/8001). members_only = 1
# limits publishing to members (and relay_pubkey).
# nip43 = 0
# members_only = 0
# invite_codes =            # comma-separated, e.g. abc123, spring-2026
# relay_contact =           # e.g. mailto:ops@example.com
# relay_icon =
# relay_banner =
# relay_software = https://github.com/Named666/nostrogotho
# relay_version = 0.2.0
# terms_of_service =
# privacy_policy =
# posting_policy =
# payments_url =
# relay_countries =         # comma-separated, e.g. US, CA
# language_tags =           # comma-separated, e.g. en, es
# relay_tags =              # comma-separated, e.g. sfw-only
# Event acceptance (MIN_POW_DIFFICULTY, CREATED_AT_LOWER_LIMIT and
# CREATED_AT_UPPER_LIMIT in the environment override these). 0 = off.
# min_pow_difficulty = 0
# created_at_lower_limit = 0
# created_at_upper_limit = 900
